name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt
          rustc --version
      - run: cargo fmt --check

  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every entry needs either `std` or `hashbrown`, because the crate
        # needs a hash map and `alloc` has none; `timing` implies `std`.
        include:
          - name: hashbrown
            flags: --no-default-features --features hashbrown
          - name: std
            flags: --no-default-features --features std
          - name: std+hashbrown
            flags: --no-default-features --features std,hashbrown
          - name: all-features
            flags: --all-features
          - name: checker
            flags: --no-default-features --features hashbrown,checker
          - name: timing
            flags: --no-default-features --features timing
          - name: trace-log
            flags: --no-default-features --features hashbrown,trace-log
          - name: entity-repr-8
            flags: --no-default-features --features hashbrown,entity-repr-8
          - name: entity-repr-16
            flags: --no-default-features --features hashbrown,entity-repr-16
          - name: entity-repr-8+entity-repr-16
            flags: --no-default-features --features hashbrown,entity-repr-8,entity-repr-16
          - name: std+checker
            flags: --no-default-features --features std,checker
          - name: serialize
            flags: --no-default-features --features hashbrown,serialize
          - name: deserialize
            flags: --no-default-features --features hashbrown,deserialize
          - name: serialize+deserialize
            flags: --no-default-features --features hashbrown,serialize,deserialize
          - name: visualizer
            flags: --no-default-features --features visualizer
          - name: visualizer+trace-log
            flags: --no-default-features --features visualizer,trace-log
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
          rustc --version
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ matrix.name }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.name }}-

      # Check the library on its own, i.e. without the dev-dependencies pulling
      # extra features in, so that the feature combination is actually exercised
      # in isolation.
      - name: Check
        run: |
          cargo check --locked --lib ${{ matrix.flags }}
          cargo check --locked --all-targets ${{ matrix.flags }}

      - name: Clippy
        run: cargo clippy --locked --all-targets ${{ matrix.flags }} -- -Dwarnings

      - name: Test
        run: cargo test --locked ${{ matrix.flags }}

  test-release:
    name: Test (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: test-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-release-

      - name: Test
        run: cargo test --locked --release --all-features

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt
          rustc --version
      - run: cargo doc --all-features

  fuzz:
    name: cargo fuzz
    runs-on: ubuntu-latest
    env:
      CARGO_FUZZ_VERSION: 0.13.2
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup update nightly --no-self-update
          rustup default nightly
          rustup component add rust-src
          rustc --version

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin
            target
          key: fuzz-${{ env.CARGO_FUZZ_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: fuzz-${{ env.CARGO_FUZZ_VERSION }}-

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version ${{ env.CARGO_FUZZ_VERSION }}

      - name: Check
        run: cargo fuzz check -s none

  js:
    name: JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd visualizer && npm test

  # A single job that depends on everything else, so that branch protection only
  # needs to require this one status check rather than every matrix entry.
  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs: [fmt, build, test-release, doc, js, fuzz]
    steps:
      - name: Check that all jobs succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
