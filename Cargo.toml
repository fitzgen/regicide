[workspace]
members = ["fuzz"]

[package]
edition = "2024"
license = "Apache-2.0 WITH LLVM-exception"
name = "regicide"
version = "0.1.0"

[dependencies]
log = "0.4.33"
rustc-hash = { version = "2.1.3", default-features = false }
hashbrown = { version = "0.17.1", default-features = false, optional = true }
serde = {
  version = "1.0.228",
  optional = true,
  default-features = false,
  features = [
    "alloc",
    "derive",
  ]
}
serde_json = { version = "1.0.145", optional = true }
mutatis = { version = "0.5.4", features = ["check", "derive"], optional = true }

[dev-dependencies]
regicide = {
  version = "0.1.0", path = ".",
  features = [
    "checker",
    "deserialize",
    "entity-repr-8",
    "entity-repr-16",
    "visualizer",
    "serialize",
    "std",
    "timing",
    "trace-log",
  ],
}
mutatis = { version = "0.5.2", features = ["check", "derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }

[[example]]
name = "visualize"
required-features = ["visualizer", "test-utils", "deserialize"]

[features]
# Use Rust's `std` crate (instead of just `core` and `alloc`).
std = []
# Enable the register allocation checker.
checker = []
# Enable timing each pass in the register allocator.
timing = ["std"]
# Enable trace-level logs.
trace-log = []
# Enable 8-bit entity representations.
entity-repr-8 = []
# Enable 16-bit entity representations.
entity-repr-16 = []
# Enable serialization via `serde`.
serialize = ["dep:serde"]
# Enable deserialization via `serde`.
deserialize = ["dep:serde"]
# Enable the HTML visualizer.
visualizer = ["std", "serialize", "dep:serde_json", "dep:mutatis"]
# Internal feature.
test-utils = ["dep:mutatis"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

# Turn on some lints which are otherwise allow-by-default in rustc.
[workspace.lints.rust]
unused_extern_crates = "warn"
trivial_numeric_casts = "warn"
unstable_features = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
  # `cfg(fuzzing)` is set by `cargo fuzz`.
  "cfg(fuzzing)",
]

# The default set of lints in Clippy is too noisy, so allow them all by
# default and then selectively enable useful ones below.
[workspace.lints.clippy]
all = { level = "allow", priority = -1 }
clone_on_copy = "warn"
map_clone = "warn"
uninlined_format_args = "warn"
unnecessary_to_owned = "warn"
manual_strip = "warn"
useless_conversion = "warn"
unnecessary_mut_passed = "warn"
unnecessary_fallible_conversions = "warn"
unnecessary_cast = "warn"
allow_attributes_without_reason = "warn"
from_over_into = "warn"
redundant_field_names = "warn"
multiple_bound_locations = "warn"
extra_unused_type_parameters = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
