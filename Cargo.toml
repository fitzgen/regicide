[package]
name = "regicide"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4.33"
rustc-hash = { version = "2.1.3", default-features = false }
hashbrown = { version = "0.17.1", default-features = false, optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.145", optional = true }

[dev-dependencies]
regicide = {
  version = "0.1.0", path = ".",
  features = [
    "std", "checker", "timing", "trace-log", "entity-repr-8", "entity-repr-16",
    "visualizer",
  ],
}
mutatis = { version = "0.5.2", features = ["check", "derive"] }

[features]
std = []
checker = []
timing = ["std"]
trace-log = []
entity-repr-8 = []
entity-repr-16 = []
visualizer = ["std", "dep:serde", "dep:serde_json"]

[lints]
workspace = true

# Turn on some lints which are otherwise allow-by-default in rustc.
[workspace.lints.rust]
unused_extern_crates = "warn"
trivial_numeric_casts = "warn"
unstable_features = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
  # `cfg(fuzz)` is set by `cargo fuzz`.
  "cfg(fuzz)",
]

# The default set of lints in Clippy is too noisy, so allow them all by
# default and then selectively enable useful ones below.
[workspace.lints.clippy]
all = { level = "allow", priority = -1 }
clone_on_copy = "warn"
map_clone = "warn"
uninlined_format_args = "warn"
unnecessary_to_owned = "warn"
manual_strip = "warn"
useless_conversion = "warn"
unnecessary_mut_passed = "warn"
unnecessary_fallible_conversions = "warn"
unnecessary_cast = "warn"
allow_attributes_without_reason = "warn"
from_over_into = "warn"
redundant_field_names = "warn"
multiple_bound_locations = "warn"
extra_unused_type_parameters = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
