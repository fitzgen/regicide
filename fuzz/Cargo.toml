[package]
name = "regicide-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0 WITH LLVM-exception"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
regicide = {
  path = "..",
  features = [
    "std",
    "checker",
    "test-utils",
    "trace-log",
    "serialize",
    "deserialize",
  ],
}
libfuzzer-sys = "0.4.13"
mutatis = { version = "0.5.2", features = ["std"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
env_logger = "0.11.8"

[lints]
workspace = true

[[bin]]
name = "allocate"
path = "fuzz_targets/allocate.rs"
test = false
doc = false
